name: Portfolio walkthrough
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/portfolio-walkthrough.yml'
permissions:
  contents: write
jobs:
  walkthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a disposable shop
        run: |
          sudo systemctl start mysql
          mysql -uroot -proot -e "CREATE DATABASE portfolio_demo CHARACTER SET utf8mb4"
          sudo apt-get update -qq
          sudo apt-get install -y php-cli php-mysql php-mbstring php-gd
          python -m venv /tmp/cmyk-browser
          /tmp/cmyk-browser/bin/pip install playwright pypdf
          echo "DEMO_SETUP_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Follow the commercial workflow in Chrome
        run: |
          php -r '$c = require "app/config.example.php"; $c = array_merge($c, ["db_host"=>"127.0.0.1","db_name"=>"portfolio_demo","db_user"=>"root","db_password"=>"root","setup_token"=>getenv("DEMO_SETUP_TOKEN")]); file_put_contents("app/config.php","<?php return ".var_export($c,true).";");'
          php -S 127.0.0.1:8080 > /tmp/cmyk-php.log 2>&1 &
          trap 'kill $! || true' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/install.php >/dev/null
          php tests/commercial-calculations.php
          /tmp/cmyk-browser/bin/python tests/portfolio_walkthrough.py || { tail -50 /tmp/cmyk-php.log; exit 1; }
      - name: Publish verified demonstration files
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- docs/demo/
          if ! git diff --cached --quiet; then
            git commit -m "Document the verified print order and invoice walkthrough"
            git push origin HEAD:main
          fi
